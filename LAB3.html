<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KOPIKU Fana - Lab 3</title>
</head>
<body>

    <!-- 1. Header Section (First div) -->
    <div>
        <h1>KOPIKU Fana</h1>
        <span>Your daily dose of fresh coffee brew</span>
    </div>

    <hr>

    <!-- 2. Content Section: Contact Form (Second div) -->
    <div>
        <h2>Customer Feedback Form</h2>
        <form action="#" method="post">
            <p>
                <label for="email">Email input for user contact:</label><br>
                <input type="email" id="email" name="email" required placeholder="fana@example.com">
            </p>
            <p>
                <label for="cdate">Date input for preferred contact date:</label><br>
                <input type="date" id="cdate" name="cdate">
            </p>
            <p>
                <label for="satisfaction">Range slider for user satisfaction level:</label><br>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="8">
            </p>
            <p>
                <button type="submit">Submit</button>
            </p>
        </form>
    </div>

    <hr>

    <!-- 3. Content Section: Inline Calculator (Third div) -->
    <div>
        <h2>Inline Calculator</h2>
        <p>Provide two number fields to sum dynamically:</p>
        <form oninput="sumResult.value = Number(num1.value) + Number(num2.value)">
            <p>
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1" value="5">
            </p>
            <p>
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2" value="10">
            </p>
            <p>
                <strong>Sum: </strong>
                <output name="sumResult" for="num1 num2">15</output>
            </p>
        </form>
    </div>

    <hr>

    <!-- 4. Footer Section (Final div) -->
    <div>
        <p>Contact Us: info@kopikufana.com | Phone: +6014-733 8867</p>
        <p>Copyright &copy; 2026 KOPIKU Fana. All rights reserved.</p>
    </div>

</body>
</html>
